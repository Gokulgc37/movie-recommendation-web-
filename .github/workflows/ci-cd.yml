name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12.3

      - name: Install dependencies
        run: |
          python -m venv env
          source env/bin/activate
          pip install -r requirements.txt

      - name: Run Tests (if applicable)
        run: |
          source env/bin/activate
          # Add your test commands here

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2-key.pem ubuntu@54.241.239.222 << 'EOF'
          cd /home/ubuntu/movie-recommendation-web- 
          git pull origin main
          if [ ! -d 'env' ]; then python3 -m venv env; fi
          source env/bin/activate
          pip install -r requirements.txt
          nohup uvicorn main:app --host 0.0.0.0 --port 8080 &
          exit 0
          EOF
